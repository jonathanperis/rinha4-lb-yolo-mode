name: Build and publish LB images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build and integration-test C and ASM implementations
        run: make clean test CFLAGS_ARCH="-march=x86-64-v3 -flto -fomit-frame-pointer"

  build-amd64:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Semantic Version
        id: semver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          latest=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [[ -z "$latest" ]]; then
            version="v1.0.0"
          else
            latest=${latest#v}
            IFS='.' read -r major minor patch <<< "$latest"
            new_patch=$((patch + 1))
            version="v${major}.${minor}.${new_patch}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract ASM Docker metadata
        id: meta-asm
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.semver.outputs.version }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=asm-ci-${{ github.sha }},enable=${{ github.event_name != 'pull_request' }}
            type=sha
      - name: Build and push ASM linux/amd64 default image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-asm.outputs.tags }}
          labels: ${{ steps.meta-asm.outputs.labels }}
          build-args: |
            LB_IMPL=asm
      - name: Build and push C baseline linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:c-ci-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:c-latest
          labels: ${{ steps.meta-asm.outputs.labels }}
          build-args: |
            LB_IMPL=c
      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.semver.outputs.version }}
          name: ${{ steps.semver.outputs.version }}
          generate_release_notes: true
